# savedsearches.conf — alert definitions for OBS1466 searches 04 and 05.
#
# Installation:
#   1. Place in $SPLUNK_HOME/etc/apps/<your_app>/local/savedsearches.conf
#   2. Restart Splunk or reload the app.
#   3. Tune the thresholds below to match your environment before enabling.
#
# These are starting points, not finished detections.
# Review and tune before production use.

[AI Agent Cost Runaway]
search = index=demo_ai_obs demo_name=ai_observability_conf26 sourcetype=ai:agent_event event_sourcetype=ai:metric metric_name=ai_cost \
  | eventstats max(demo_run_epoch) as latest_demo_run \
  | where demo_run_epoch=latest_demo_run \
  | dedup keepempty=true trace_id metric_name retry_count \
  | stats sum(cost_usd) as total_cost sum(total_tokens) as total_tokens max(retry_count) as retries by trace_id user_id workflow prompt_type model_name \
  | eval total_cost=round(total_cost,2) \
  | where total_cost > 50 OR retries >= 4 \
  | eval action=case(total_cost>100,"page",total_cost>50,"ticket",true(),"log")
# Tune threshold: $50 is a conference demo value.
# Set to 2–3x your typical per-session cost baseline before enabling alerts.
# Example: if normal sessions cost $0.10–$0.30, set threshold to $1.
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
alert.suppress = 0
counttype = number of results
relation = greater than
quantity = 0
alert.actions = email
action.email.to = your-team@example.com
action.email.subject = AI Agent Cost Runaway Detected
disabled = 1

[AI Prompt Injection Detected]
search = index=demo_ai_obs demo_name=ai_observability_conf26 sourcetype=ai:agent_event event_sourcetype=ai:metric metric_name=prompt_injection \
  | eventstats max(demo_run_epoch) as latest_demo_run \
  | where demo_run_epoch=latest_demo_run \
  | dedup keepempty=true trace_id metric_name \
  | where prompt_injection_score >= 0.75 OR policy_action="blocked"
# Tune threshold: start at 0.75. Lower toward 0.5 for earlier warning.
# Raise toward 0.9 if you see false positives on benign inputs.
# policy_action=blocked fires regardless of score — always keep both conditions.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 2
alert.suppress = 0
counttype = number of results
relation = greater than
quantity = 0
alert.actions = email
action.email.to = your-team@example.com
action.email.subject = AI Prompt Injection Detected
disabled = 1
