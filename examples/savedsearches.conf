# savedsearches.conf — alert definitions for OBS1466 searches 02, 04, and 05.
#
# Installation:
#   1. Place in $SPLUNK_HOME/etc/apps/<your_app>/local/savedsearches.conf
#   2. Restart Splunk or reload the app.
#   3. Tune the thresholds below to match your environment before enabling.
#
# These are starting points, not finished detections.
# Review and tune before production use.

[AI Agent Unapproved File Share]
search = index=demo_ai_obs demo_name=ai_observability_conf26 sourcetype=ai:agent_event event_sourcetype=ai:agent_log \
  | eventstats max(demo_run_epoch) as latest_run \
  | where demo_run_epoch=latest_run \
  | stats values(tool_name) as tools values(file_path) as files values(policy_action) as actions values(user_id) as user min(_time) as first_seen by trace_id \
  | where mvfind(tools,"file_write")>=0 AND mvfind(actions,"blocked")>=0 \
  | eval files=mvjoin(files,", "), user=mvjoin(user,", ") \
  | eval first_seen=strftime(first_seen,"%Y-%m-%d %H:%M:%S") \
  | eval severity="medium", finding="AI agent created file with no approved delivery path" \
  | table trace_id first_seen user files severity finding
# This is the highest-fidelity detection in the repo: file created + delivery blocked.
# Correlate with search 12 (EDR correlation) to confirm whether an endpoint control also fired.
# Run every 5 minutes. A single result warrants immediate investigation.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 2
alert.suppress = 0
counttype = number of results
relation = greater than
quantity = 0
alert.actions = email
action.email.to = your-team@example.com
action.email.subject = AI Agent Created File With No Approved Delivery Path
disabled = 1

[AI Agent Cost Runaway]
search = index=demo_ai_obs demo_name=ai_observability_conf26 sourcetype=ai:agent_event event_sourcetype=ai:metric metric_name=ai_cost \
  | eventstats max(demo_run_epoch) as latest_demo_run \
  | where demo_run_epoch=latest_demo_run \
  | dedup keepempty=true trace_id metric_name retry_count \
  | stats sum(cost_usd) as total_cost sum(total_tokens) as total_tokens max(retry_count) as retries by trace_id user_id workflow prompt_type model_name \
  | eval total_cost=round(total_cost,2) \
  | where total_cost > 50 OR retries >= 4 \
  | eval action=case(total_cost>100,"page",total_cost>50,"ticket",true(),"log")
# Tune threshold: $50 is a conference demo value.
# Set to 2–3x your typical per-session cost baseline before enabling alerts.
# Example: if normal sessions cost $0.10–$0.30, set threshold to $1.
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
alert.suppress = 0
counttype = number of results
relation = greater than
quantity = 0
alert.actions = email
action.email.to = your-team@example.com
action.email.subject = AI Agent Cost Runaway Detected
disabled = 1

[AI Prompt Injection Detected]
search = index=demo_ai_obs demo_name=ai_observability_conf26 sourcetype=ai:agent_event event_sourcetype=ai:metric metric_name=prompt_injection \
  | eventstats max(demo_run_epoch) as latest_demo_run \
  | where demo_run_epoch=latest_demo_run \
  | dedup keepempty=true trace_id metric_name \
  | where prompt_injection_score >= 0.75 OR policy_action="blocked"
# Tune threshold: start at 0.75. Lower toward 0.5 for earlier warning.
# Raise toward 0.9 if you see false positives on benign inputs.
# policy_action=blocked fires regardless of score — always keep both conditions.
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.track = 1
alert.severity = 2
alert.suppress = 0
counttype = number of results
relation = greater than
quantity = 0
alert.actions = email
action.email.to = your-team@example.com
action.email.subject = AI Prompt Injection Detected
disabled = 1

[AI Agent Quality and Latency Drift]
search = index=demo_ai_obs demo_name=ai_observability_conf26 sourcetype=ai:agent_event event_sourcetype=ai:trace span_name=model.turn \
  | sort 0 _time \
  | streamstats window=100 avg(duration_ms) as p_avg_latency stdev(duration_ms) as p_std_latency current=false \
  | eval latency_threshold=if(p_std_latency>0, p_avg_latency + 2*p_std_latency, 30000) \
  | eval is_latency_spike=if(duration_ms > latency_threshold, "yes", "no") \
  | eval issue=case(schema_valid=false,"schema failure", quality_score<0.6,"quality drop", is_latency_spike="yes","latency spike", isnotnull(risk_signal) AND len(risk_signal)>0, risk_signal) \
  | where isnotnull(issue) \
  | table _time trace_id user_id workflow issue quality_score duration_ms p_avg_latency policy_action
# Statistical threshold adapts to your baseline — no hardcoded values.
# Tune the 2x multiplier (more sensitive = lower, e.g. 1.5) or quality threshold (< 0.6)
# after observing 1-2 weeks of normal traffic.
# Runs every 15 minutes; window=100 gives a rolling ~100-request baseline.
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert.track = 1
alert.severity = 3
alert.suppress = 0
counttype = number of results
relation = greater than
quantity = 0
alert.actions = email
action.email.to = your-team@example.com
action.email.subject = AI Agent Quality or Latency Drift Detected
disabled = 1
