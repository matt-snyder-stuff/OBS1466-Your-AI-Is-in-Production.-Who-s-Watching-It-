# props.conf — field extraction configuration for OBS1466 sourcetypes.
#
# Installation:
#   Option A (Splunk app):
#     Place in $SPLUNK_HOME/etc/apps/<your_app>/local/props.conf
#     Restart Splunk or reload the app (Settings → Server Controls → Restart).
#
#   Option B (system-wide):
#     Place in $SPLUNK_HOME/etc/system/local/props.conf
#     Not recommended — prefer app isolation.
#
# Without this file, Splunk can still search all fields at search time using
# auto-KV extraction, but field extraction will be slower and field names will
# not appear in the field picker without being searched first. Adding this file
# makes extractions explicit, faster, and visible in the UI immediately.
#
# HEC note: when events arrive via HEC with "event": {...} as a JSON object,
# Splunk serializes the object to a JSON string as _raw. KV_MODE=json then
# parses that string at search time to extract fields. This is the correct
# setting for the sample data format used in this repo.

[ai:agent_event]
# All agent telemetry: chat, trace, agent_log, and metric events.
# The event_sourcetype field inside each event routes to the sub-type.
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 100000
# Accelerate the most-searched fields for high-ingest environments.
# Uncomment and adjust if you see slow searches at volume.
# INDEXED_EXTRACTIONS = json

[edr:process]
# Endpoint detection events. Uses the same JSON structure.
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 50000

# ---------------------------------------------------------------------------
# Field aliases — map your framework's field names to the names the searches
# expect without modifying the searches themselves.
#
# Example: if your agent emits "run_id" instead of "trace_id":
#
# [ai:agent_event]
# FIELDALIAS-trace_id = run_id AS trace_id
#
# Example: if your agent emits "latency_ms" instead of "duration_ms":
#
# [ai:agent_event]
# FIELDALIAS-duration_ms = latency_ms AS duration_ms
#
# Example: if your EDR tool uses "user" instead of "user_id":
#
# [edr:process]
# FIELDALIAS-user_id = user AS user_id
# ---------------------------------------------------------------------------
